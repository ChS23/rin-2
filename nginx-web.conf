server {
    listen 80;
    root /data/scripts/chastota_web;
    index index.html;

    types {
        application/wasm wasm;
        application/javascript js;
        text/html html;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        application/octet-stream data;
        application/zip zip;
        text/css css;
        application/manifest+json webmanifest;
    }

    # WASM и JS не меняются между билдами — кэшируем
    location ~* \.(wasm|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Всё остальное — без кэша (game.zip, data, index.html меняются при пересборке)
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
