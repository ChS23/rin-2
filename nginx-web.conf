server {
    listen 80;
    root /data/scripts/chastota_web;
    index index.html;

    # WASM MIME type для быстрой загрузки
    types {
        application/wasm wasm;
        application/javascript js;
        text/html html;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        application/octet-stream data;
        application/zip zip;
        text/css css;
        application/manifest+json webmanifest;
    }

    # Кэш для тяжёлых файлов (wasm, data)
    location ~* \.(wasm|data|zip)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Без кэша для index.html (чтобы пересборка сразу была видна)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
