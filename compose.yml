services:
  bot:
    container_name: rin-bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://valkey:6379
      - TZ=Europe/Moscow
    volumes:
      - bot_data:/app/data
    depends_on:
      - valkey
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: rin-valkey
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel warning
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: rin-web
    volumes:
      - bot_data:/data:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - gateway
    depends_on:
      - bot
    restart: unless-stopped

networks:
  gateway:
    external: true
    name: gateway-net

volumes:
  bot_data:
  valkey_data:
