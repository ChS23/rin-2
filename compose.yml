services:
  bot:
    container_name: rin-bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://valkey:6379
    volumes:
      - bot_data:/app/data
    depends_on:
      - valkey
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: rin-valkey
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel warning
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: rin-web
    volumes:
      - bot_data:/data:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3721:80"
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  bot_data:
  valkey_data:
